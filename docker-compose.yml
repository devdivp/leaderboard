version: '3'

networks:
    nginx-php74-mysql8-phpmyadmin:

services:

    # nginx
    nginx-service:
        image: nginx:stable-alpine
        container_name: nginx-container
        ports:
            - "8000:8000"
        volumes:
            - .:/var/www/project
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - php74-service
            - mysql8-service
        networks:
            - nginx-php74-mysql8-phpmyadmin

    # php
    php74-service:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: php74-container
        ports:
            - "9000:9000"
        volumes:
            - .:/var/www/project
        networks:
            - nginx-php74-mysql8-phpmyadmin

    # mysql
    mysql8-service:
        image: mysql:8
        container_name: mysql8-container
        ports:
            - "3306:3306"
        volumes:
            - ./mysql:/var/lib/mysql
        command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
        restart: always # always restart unless stopped manually
        environment:
            MYSQL_DATABASE: leaderboard
            MYSQL_ROOT_PASSWORD: root
            MYSQL_PASSWORD: root
        networks:
            - nginx-php74-mysql8-phpmyadmin

    # phpmyadmin
    phpmyadmin-service:
        image: phpmyadmin
        container_name: phpmyadmin-container
        ports:
            - "8080:80"
        restart: always
        environment:
            PMA_HOST: mysql8-service
            PMA_USER: root
            PMA_PASSWORD: root
            MYSQL_ROOT_PASSWORD: root
        networks:
            - nginx-php74-mysql8-phpmyadmin